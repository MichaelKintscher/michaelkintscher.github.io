<section>
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
    <div class="row">
        <div *ngFor="let data of listData"
                class="work-item">
            <h3>{{ data.title }}</h3>
            <ul>
                <li *ngFor="let item of data.items"
                    class="">
                    <div [innerHTML]="item.bullet"></div>
                    <div [innerHTML]="item.text"></div>
                </li>
            </ul>
        </div>
        
    </div>
</section>
