<section id="three">
    <h2>{{ title }}</h2>
    <p>{{ description }}</p>
    <div class="row">
        <ul>
            <li *ngFor="let data of listData">
                <a [href]="data.link == '' ? null : data.link"
                    target="_blank"
                    [class.disabled]="data.link == '' ? true : null">
                    <div class="list-item-div">
                        <div class="list-item-header-image"
                            [ngStyle]="{'background-image': 'url(' + data.imageSource + ')'}"></div>
                        <div>
                            <h3 class="list-item-title">{{ data.title }}</h3>
                            <p class="list-item-description">{{ data.description }}</p>
                        </div>
                    </div>
                </a>
            </li>
        </ul>
    </div>
</section>
